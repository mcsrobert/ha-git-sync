name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          git_sync=$(sed -n 's|^FROM registry.k8s.io/git-sync/git-sync:\(v[^@]*\)@.*|\1|p' Dockerfile)
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "description=git-sync ${git_sync} sidecar that deploys a Home Assistant configuration from Git and reloads or restarts Home Assistant"
          } >> "${GITHUB_OUTPUT}"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=ha-git-sync
            org.opencontainers.image.description=${{ steps.version.outputs.description }}
          annotations: |
            org.opencontainers.image.title=ha-git-sync
            org.opencontainers.image.description=${{ steps.version.outputs.description }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the version is new
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1); then
            echo "::error::${IMAGE}:${VERSION} already exists. Tag a new version instead."
            exit 1
          elif [[ $output != *": not found"* ]]; then
            echo "::error::Could not check whether ${IMAGE}:${VERSION} exists: ${output}"
            exit 1
          fi

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Test the image
        env:
          HA_GIT_SYNC_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          PYTHONPATH: .
        run: |
          python -P -m pip install --disable-pip-version-check --quiet -r tests/requirements.txt
          python -P -m unittest discover -s tests -p test_sidecar.py -v

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            [[ -n $tag ]] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Add the image and actions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          changelog=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)
          notes=$(printf 'Image: `%s:%s@%s`\n\nActions: `%s/check@%s` and `%s/promote@%s`\n\n%s\n' \
            "${IMAGE}" "${VERSION}" "${DIGEST}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${changelog}")
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes "${notes}"
